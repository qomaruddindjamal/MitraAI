[package]
name = "mitra_ai"
version = "0.1.0"
edition = "2024"
authors = ["MitraAI Core Team"]
description = "Native Rust Inference Runtime for Qwen3 Architecture"

[dependencies]
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
